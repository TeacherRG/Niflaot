name: Deploy to GitHub Pages (niflaot.mychitas.app)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # the whole history: sitemap lastmod and JSON-LD dateModified are the days the pages' sources last changed
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check   # lesson data must be consistent before publishing
      - run: npm run build
        env:
          # URL of the AI assistant worker (assistant/); empty → the assistant is hidden
          VITE_ASSISTANT_URL: ${{ vars.ASSISTANT_URL }}
          # newsletter sign-up form (src/components/Subscribe.tsx), e.g. https://buttondown.com/api/emails/embed-subscribe/<name>;
          # empty → the form is hidden
          VITE_SUBSCRIBE_URL: ${{ vars.SUBSCRIBE_URL }}
          # webmaster tools: the code of the «HTML tag» confirmation (scripts/prerender.ts); empty → no tag
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
          # the Android app in Google Play (Trusted Web Activity): its package and the SHA-256 fingerprints of its signing
          # certificates from Play Console, comma-separated → dist/.well-known/assetlinks.json; empty → no file
          ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}
          ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://niflaot.mychitas.app
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # tell the search engines (Bing, Yandex… — IndexNow) that the pages changed; never fails the deploy
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts/indexnow.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
