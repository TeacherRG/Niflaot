name: Неделя в Академии в Telegram

# Every Wednesday morning — the digest of the week «Неделя в Академии» (scripts/telegram-digest.ts): the whole week,
# Sunday to Friday — the Prophets, the Writings, the Baal HaTurim of the portion and Chassidut, briefly — and the PDF of the
# digest, in each channel's language (owner, 10.11.2026: it came late at night — «с утра или хотя бы днём»). GitHub starts
# scheduled runs late and sometimes drops them, so there is an attempt every 10 minutes 07:00–14:50 UTC on Wednesdays
# (9:00–16:50 Vienna in summer, 8:00–15:50 in winter); attempts before 9:00 Vienna stop at once, and one GitHub starts after
# 20:00 Vienna doesn't post at night. The first attempt that gets through posts and saves a mark for the day in the Actions cache (key
# digest-posted-<date>) — also when there is nothing to post (a week without learning); the later attempts see it and stop
# before installing anything. On Shabbat — nothing, even by hand.
# Manual run (Run workflow): posts the digest of this week so far right away, unless today is already done; «force» —
# post again anyway. Setup: the same secret TELEGRAM_BOT_TOKEN and variables TELEGRAM_CHAT_RU / _EN / _DE as
# «К шабатнему столу»; a language without a channel is skipped.
on:
  schedule:
    - cron: '*/10 7-14 * * 3'
  workflow_dispatch:
    inputs:
      force:
        description: 'Опубликовать, даже если сегодня дайджест уже выходил'
        type: boolean
        default: false

permissions:
  contents: read

# one run at a time: a late cron and a manual run must not post twice
concurrency:
  group: telegram-digest
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_RU: ${{ vars.TELEGRAM_CHAT_RU || secrets.TELEGRAM_CHAT_RU }}
      TELEGRAM_CHAT_EN: ${{ vars.TELEGRAM_CHAT_EN || secrets.TELEGRAM_CHAT_EN }}
      TELEGRAM_CHAT_DE: ${{ vars.TELEGRAM_CHAT_DE || secrets.TELEGRAM_CHAT_DE }}
      # optional: the Mini App from @BotFather (<bot>/<app>) — a button «open in Telegram» under the post
      TELEGRAM_APP: ${{ vars.TELEGRAM_APP }}
      TELEGRAM_SCHEDULE: ${{ github.event.schedule }}
      DIGEST_POSTED_FILE: .digest-posted
    steps:
      # «go» — this attempt should work: it is 9:00–19:59 Vienna (a scheduled run) and today is not done yet
      - name: Today
        id: day
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          hour=$(TZ=Europe/Vienna date +%-H)
          if [ -n "$TELEGRAM_SCHEDULE" ] && [ "$hour" -lt 9 ]; then echo "early=true" >> "$GITHUB_OUTPUT"; echo "В Вене $hour ч — до 9:00 не публикуем."; fi
          if [ -n "$TELEGRAM_SCHEDULE" ] && [ "$hour" -ge 20 ]; then echo "early=true" >> "$GITHUB_OUTPUT"; echo "В Вене $hour ч — поздно, ночью не публикуем."; fi
      # has today's post already gone out? (lookup only — nothing to download)
      - name: Already done today?
        id: posted
        if: steps.day.outputs.early != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .digest-posted
          key: digest-posted-${{ steps.day.outputs.date }}
          lookup-only: true
      - name: Skip
        if: steps.posted.outputs.cache-hit == 'true' && !inputs.force
        run: echo "За ${{ steps.day.outputs.date }} всё уже сделано (пост вышел или публиковать нечего) — эта попытка ничего не делает."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.day.outputs.early != 'true' && (steps.posted.outputs.cache-hit != 'true' || inputs.force)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.day.outputs.early != 'true' && (steps.posted.outputs.cache-hit != 'true' || inputs.force)
        with:
          node-version: 22
          cache: npm
      - if: steps.day.outputs.early != 'true' && (steps.posted.outputs.cache-hit != 'true' || inputs.force)
        run: npm ci
      # a browser for the PDF of the digest (scripts/telegram-digest.ts prints the site's page)
      - if: steps.day.outputs.early != 'true' && (steps.posted.outputs.cache-hit != 'true' || inputs.force)
        run: npm i --no-save playwright && npx playwright install --with-deps chromium
      # without the token the run is red with a clear message — not green with a silently skipped post
      - name: Check settings
        if: steps.day.outputs.early != 'true' && (steps.posted.outputs.cache-hit != 'true' || inputs.force)
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::Нет секрета TELEGRAM_BOT_TOKEN: Settings → Secrets and variables → Actions → вкладка Secrets (не Variables) → Repository secrets."
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_RU$TELEGRAM_CHAT_EN$TELEGRAM_CHAT_DE" ]; then
            echo "::error::Не задан ни один канал (TELEGRAM_CHAT_RU / _EN / _DE): Settings → Secrets and variables → Actions (вкладка Variables или Secrets)."
            exit 1
          fi
      - name: Post
        if: steps.day.outputs.early != 'true' && (steps.posted.outputs.cache-hit != 'true' || inputs.force)
        run: npx tsx scripts/telegram-digest.ts
      # the text went out (even if the PDF failed and the run is red) or there is nothing to post today: remember it,
      # so the later attempts don't repeat it
      - name: Remember today
        if: always() && hashFiles('.digest-posted') != '' && steps.posted.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .digest-posted
          key: digest-posted-${{ steps.day.outputs.date }}
