# Publishes the AI assistant (assistant/, Cloudflare Worker) — by hand from the Actions tab
# and on every push to main that changes assistant/.
# Needs repository secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and ANTHROPIC_API_KEY.
# Registration (login codes by email): secret RESEND_API_KEY and, if the sender is not noreply@mychitas.app,
# variable MAIL_FROM (e.g. «Нифлаот <noreply@your-domain>»; the domain must be verified at Resend).
# «Слушать» (lessons read aloud by Gemini TTS): secret GEMINI_API_KEY (Google AI Studio → Get API key).
# The worker's address is printed at the end of the "Deploy" step; put it into the variable ASSISTANT_URL.
name: Deploy AI assistant

on:
  workflow_dispatch:
  push:
    branches: [main]
    # the worker also bundles these files of the site
    paths: ['assistant/**', 'src/core/gematria.ts', 'src/core/sync.ts', 'src/core/quizGame.ts']

concurrency:
  group: assistant
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # secrets can't be read in `if:` — whether the mail key is set, as a job variable
      HAS_RESEND: ${{ secrets.RESEND_API_KEY != '' }}
      HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assistant/package-lock.json
      - run: npm ci
        working-directory: assistant
      - run: npx tsc --noEmit
        working-directory: assistant
      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: assistant
          secrets: |
            ANTHROPIC_API_KEY
          vars: |
            MAIL_FROM
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM || 'Нифлаот <noreply@mychitas.app>' }}
      # registration turns on when the repository has the secret RESEND_API_KEY
      - name: Mail key for login codes
        if: ${{ env.HAS_RESEND == 'true' }}
        working-directory: assistant
        run: printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # «Слушать» turns on when the repository has the secret GEMINI_API_KEY
      - name: Gemini key for reading aloud
        if: ${{ env.HAS_GEMINI == 'true' }}
        working-directory: assistant
        run: printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
