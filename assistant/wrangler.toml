name = "niflaot-assistant"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://niflaot.mychitas.app"

# Secret (not stored here): npx wrangler secret put ANTHROPIC_API_KEY

# Rate limit for /chat: 20 requests per minute from one IP (the worker answers 429 above it).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# The daily reminder of the site (src/push.ts): subscriptions in a Durable Object with SQLite storage (free plan),
# sending once an hour.
[[durable_objects.bindings]]
name = "PUSH"
class_name = "PushHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PushHub"]

[triggers]
crons = ["1 * * * *"]
