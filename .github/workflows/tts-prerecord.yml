# «Слушать»: records the parts ahead (scripts/tts-prerecord.ts) — every lesson and the passages of the Prophets / Writings
# for the next days. Only by hand from the Actions tab (language, days): a part is recorded when a listener presses
# «Слушать» (the owner, 27.10.2026: no recording ahead), so nothing runs after a deploy or in the morning any more.
# Needs the variable ASSISTANT_URL; the worker records with Gemini TTS (secret GEMINI_API_KEY of the worker).
name: Pre-record narration

on:
  workflow_dispatch:
    inputs:
      lang:
        description: 'Language: ru, en or de'
        default: 'ru'
      days:
        description: 'Days of the Prophets / Writings from today'
        default: '14'

concurrency:
  group: tts-prerecord
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/tts-prerecord.ts --lang "${{ inputs.lang || 'ru' }}" --days "${{ inputs.days || '14' }}"
        env:
          ASSISTANT_URL: ${{ vars.ASSISTANT_URL }}
