# The podcast: every night and after a pre-recording by hand (tts-prerecord.yml; parts are recorded when listeners press
# «Слушать»), every lesson whose parts are all recorded becomes one MP3 episode in the release `podcast`
# (scripts/podcast.ts). New or changed episodes — the site is deployed again, and its build writes the feeds
# podcast.xml / podcast-en.xml / podcast-de.xml. Nothing new — nothing happens (so the chain stops after one round).
# Needs the variable ASSISTANT_URL.
name: Podcast

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Pre-record narration']
    types: [completed]
  schedule:
    # Sunday to Friday 03:41 UTC
    - cron: '41 3 * * 0-5'

permissions:
  contents: write   # upload the episodes to the release
  actions: write    # start the deploy of the site

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  episodes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - id: build
        run: npx tsx scripts/podcast.ts
        env:
          ASSISTANT_URL: ${{ vars.ASSISTANT_URL }}
          GH_TOKEN: ${{ github.token }}
      # a push with GITHUB_TOKEN starts no workflows, a workflow_dispatch does
      - if: steps.build.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
