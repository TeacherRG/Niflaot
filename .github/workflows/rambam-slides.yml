# «Мишне Тора — глава в день»: the slide images (rambam-slides/<chapter>/NN.webp) → Cloudflare R2, bucket niflaot-rambam
# (public URL — SLIDES_URL in src/core/rambam.ts). On a push to main — the new and changed files; by hand — all of them
# (or one chapter). Needs the secrets CLOUDFLARE_API_TOKEN (with «Workers R2 Storage: Edit») and CLOUDFLARE_ACCOUNT_ID.
name: Rambam slides → R2

on:
  push:
    branches: [main]
    paths: ['rambam-slides/**']
  workflow_dispatch:
    inputs:
      chapter:
        description: 'Глава (forbidden-foods-14); пусто — все'
        required: false

permissions:
  contents: read

concurrency:
  group: rambam-slides
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Which files
        id: files
        env:
          CHAPTER: ${{ inputs.chapter }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = push ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- rambam-slides > files.txt
          elif [ -n "$CHAPTER" ]; then
            case "$CHAPTER" in *[!a-z0-9-]*) echo "bad chapter"; exit 1;; esac
            find "rambam-slides/$CHAPTER" -name '*.webp' > files.txt
          else
            find rambam-slides -name '*.webp' > files.txt
          fi
          grep -c . files.txt || true
      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm i --no-save wrangler@4 >/dev/null
          while read -r f; do
            [ -f "$f" ] || continue
            key="${f#rambam-slides/}"
            for try in 1 2 3; do
              npx wrangler r2 object put "niflaot-rambam/$key" --file "$f" --content-type image/webp \
                --cache-control "public, max-age=31536000, immutable" --remote && break
              sleep 5
            done
          done < files.txt
