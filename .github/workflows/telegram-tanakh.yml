name: Пророки и Писания в Telegram

# Every morning — the passage of the day of the three-year cycle, from 6:00 Vienna time on.
# GitHub starts scheduled runs late and sometimes drops them (on 13.10.2026 no morning run came at all), so there is an
# attempt every 5 minutes 04:00–06:55 UTC = 6:00–8:55 Vienna in summer (CEST) and 5:00–7:55 in winter (CET); attempts
# before 6:00 Vienna stop at once. The first attempt that gets through posts (scripts/telegram-tanakh.ts) and saves
# a mark for the day in the Actions cache (key tanakh-posted-<date>) — also on a day with nothing to post (Shabbat,
# holidays, 9 Av); the later attempts of the day see it and stop before installing anything.
# Manual run (Run workflow): posts right away, unless today is already done; «force» — post again anyway.
# Setup: the same secret TELEGRAM_BOT_TOKEN and variable TELEGRAM_CHAT_RU as «Загадка недели».
# For now — the Russian channel only; to add English / German, pass TELEGRAM_CHAT_EN / _DE below (the script has their texts).
on:
  schedule:
    - cron: '*/5 4-6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Опубликовать, даже если сегодня пост уже был'
        type: boolean
        default: false

permissions:
  contents: read

# one run at a time: a late cron and a manual run must not post twice
concurrency:
  group: telegram-tanakh
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_RU: ${{ vars.TELEGRAM_CHAT_RU || secrets.TELEGRAM_CHAT_RU }}
      # optional: the Mini App from @BotFather (<bot>/<app>) — a button «open in Telegram» under the post
      TELEGRAM_APP: ${{ vars.TELEGRAM_APP }}
      TELEGRAM_SCHEDULE: ${{ github.event.schedule }}
      TANAKH_POSTED_FILE: .tanakh-posted
    steps:
      # «go» — this attempt should work: it is not before 6:00 Vienna (a scheduled run) and today is not done yet
      - name: Today
        id: day
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          hour=$(TZ=Europe/Vienna date +%-H)
          if [ -n "$TELEGRAM_SCHEDULE" ] && [ "$hour" -lt 6 ]; then echo "early=true" >> "$GITHUB_OUTPUT"; echo "В Вене $hour ч — до 6:00 не публикуем."; fi
      # has today's post already gone out? (lookup only — nothing to download)
      - name: Already done today?
        id: posted
        if: steps.day.outputs.early != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tanakh-posted
          key: tanakh-posted-${{ steps.day.outputs.date }}
          lookup-only: true
      - name: Skip
        if: steps.posted.outputs.cache-hit == 'true' && !inputs.force
        run: echo "За ${{ steps.day.outputs.date }} всё уже сделано (пост вышел или публиковать нечего) — эта попытка ничего не делает."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.day.outputs.early != 'true' && (steps.posted.outputs.cache-hit != 'true' || inputs.force)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.day.outputs.early != 'true' && (steps.posted.outputs.cache-hit != 'true' || inputs.force)
        with:
          node-version: 22
          cache: npm
      - if: steps.day.outputs.early != 'true' && (steps.posted.outputs.cache-hit != 'true' || inputs.force)
        run: npm ci
      # a browser for the day's PDF (scripts/telegram-tanakh.ts prints the site's page of the day)
      - if: steps.day.outputs.early != 'true' && (steps.posted.outputs.cache-hit != 'true' || inputs.force)
        run: npm i --no-save playwright && npx playwright install --with-deps chromium
      # without the token the run is red with a clear message — not green with a silently skipped post
      - name: Check settings
        if: steps.day.outputs.early != 'true' && (steps.posted.outputs.cache-hit != 'true' || inputs.force)
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::Нет секрета TELEGRAM_BOT_TOKEN: Settings → Secrets and variables → Actions → вкладка Secrets (не Variables) → Repository secrets."
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_RU$TELEGRAM_CHAT_EN$TELEGRAM_CHAT_DE" ]; then
            echo "::error::Не задан ни один канал (TELEGRAM_CHAT_RU): Settings → Secrets and variables → Actions (вкладка Variables или Secrets)."
            exit 1
          fi
      - name: Post
        if: steps.day.outputs.early != 'true' && (steps.posted.outputs.cache-hit != 'true' || inputs.force)
        run: npx tsx scripts/telegram-tanakh.ts
      # the text went out (even if the PDF failed and the run is red) or there is nothing to post today: remember it,
      # so the later attempts don't repeat it
      - name: Remember today
        if: always() && hashFiles('.tanakh-posted') != '' && steps.posted.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tanakh-posted
          key: tanakh-posted-${{ steps.day.outputs.date }}
