# Temporary diagnostics of «Слушать» (clicks in the sound) — removed after the fix.
name: TTS diagnostics
on:
  push:
    branches: [ccr-bcbefd1a-7a17hb]
    paths: ['.github/workflows/tts-diag.yml', 'scripts/tts-diag.py']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Recorded parts and the same text from three models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ASSISTANT_URL: ${{ vars.ASSISTANT_URL }}
        run: |
          curl -sf https://niflaot.mychitas.app/tts/ru/baal-haturim-noach.json -o m.json
          for i in 0 1 2; do
            H=$(jq -r ".parts[$i].h" m.json)
            curl -s -o worker-$i.wav -w "worker part $i: %{http_code} %{size_download} bytes in %{time_total}s\n" "${ASSISTANT_URL%/}/tts/ru/baal-haturim-noach/$H.wav"
          done
          jq -r '.parts[1].text' m.json | head -c 600 > text.txt
          for m in gemini-2.5-flash-preview-tts gemini-2.5-pro-preview-tts gemini-3.1-flash-tts-preview; do
            jq -n --rawfile t text.txt '{contents:[{parts:[{text:("Прочитай вслух по-русски, спокойно и тепло:\n\n" + $t)}]}],generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:"Charon"}}}}}' > req.json
            curl -s -o $m.json -w "$m: %{http_code} %{size_download} bytes in %{time_total}s\n" -H 'Content-Type: application/json' -H "x-goog-api-key: $GEMINI_API_KEY" \
              -d @req.json https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent
          done
          python3 scripts/tts-diag.py worker-0.wav worker-1.wav worker-2.wav gemini-2.5-flash-preview-tts.json gemini-2.5-pro-preview-tts.json gemini-3.1-flash-tts-preview.json
      - uses: actions/upload-artifact@v4 # temporary workflow
        if: always()
        with:
          name: tts-diag
          path: '*.wav'
