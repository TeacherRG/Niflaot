# Publishes the AI assistant (assistant/, Cloudflare Worker) — by hand from the Actions tab
# and on every push to main that changes assistant/.
# Needs repository secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and ANTHROPIC_API_KEY.
# Registration (login codes by email): secret RESEND_API_KEY and, if the sender is not noreply@mychitas.app,
# variable MAIL_FROM (e.g. «Нифлаот <noreply@your-domain>»; the domain must be verified at Resend).
# «Слушать» (lessons read aloud by Google Cloud Text-to-Speech, Chirp 3 HD): secret GOOGLE_TTS_KEY — an API key of a
# Google Cloud project with the Text-to-Speech API on (without it the worker tries GEMINI_API_KEY).
# The worker's address is printed at the end of the "Deploy" step; put it into the variable ASSISTANT_URL.
name: Deploy AI assistant

on:
  workflow_dispatch:
  push:
    branches: [main]
    # the worker also bundles these files of the site
    paths: ['assistant/**', 'src/core/gematria.ts', 'src/core/sync.ts', 'src/core/quizGame.ts', 'src/core/speech.ts', 'src/core/tanakhNarration.ts', 'src/core/names.ts', 'src/core/tanakhCycle.ts', 'src/tanakh/books.json']

concurrency:
  group: assistant
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # secrets can't be read in `if:` — whether the mail key is set, as a job variable
      HAS_RESEND: ${{ secrets.RESEND_API_KEY != '' }}
      HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
      HAS_GOOGLE_TTS: ${{ secrets.GOOGLE_TTS_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assistant/package-lock.json
      - run: npm ci
        working-directory: assistant
      - run: npx tsc --noEmit
        working-directory: assistant
      - name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: assistant
          secrets: |
            ANTHROPIC_API_KEY
          vars: |
            MAIL_FROM
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM || 'Нифлаот <noreply@mychitas.app>' }}
      # registration turns on when the repository has the secret RESEND_API_KEY
      - name: Mail key for login codes
        if: ${{ env.HAS_RESEND == 'true' }}
        working-directory: assistant
        run: printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # «Слушать» turns on when the repository has the secret GEMINI_API_KEY
      - name: Gemini key for reading aloud
        if: ${{ env.HAS_GEMINI == 'true' }}
        working-directory: assistant
        run: printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # «Слушать»: the key of Google Cloud Text-to-Speech
      - name: Text-to-Speech key for reading aloud
        if: ${{ env.HAS_GOOGLE_TTS == 'true' }}
        working-directory: assistant
        run: printf '%s' "$GOOGLE_TTS_KEY" | npx wrangler secret put GOOGLE_TTS_KEY
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
