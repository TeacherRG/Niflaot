# «Niflaot» for Google Play — a Trusted Web Activity (TWA): the site niflaot.app full screen in an Android app.
# The app is generated by Bubblewrap from android/twa-manifest.json and signed with the upload key from the secrets.
#
# Run by hand (Actions → «Android app (TWA) for Google Play» → Run workflow):
#   mode = new-key — once, the very first time: makes the upload key, protected by the secret ANDROID_KEYSTORE_PASSWORD
#                    (set it before: Settings → Secrets → Actions, at least 8 characters, keep it in a safe place too);
#                    the artifact «upload-key» — the key file and its base64 text: put the text into the secret
#                    ANDROID_KEYSTORE_BASE64, keep the file in a safe place, then delete the artifact (it lives 1 day).
#   mode = build   — every release: the signed .aab for Play Console (+ .apk to try on a phone) and assetlinks.json.
#                    version_code must grow with every upload to Play (1, 2, 3…); version_name — what people see (1.0.1).
# The site itself updates without a new build; a new .aab — only for a new icon, name, package or Android target.
name: Android app (TWA) for Google Play

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'build — the .aab for Play; new-key — make the upload key (once)'
        type: choice
        options: [build, new-key]
        default: build
      version_code:
        description: 'versionCode — a whole number, larger than the last upload to Play'
        default: '1'
      version_name:
        description: 'versionName — what people see in Play'
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: android-twa
  cancel-in-progress: false

env:
  # pinned: a new Bubblewrap may generate a different project — update on purpose
  BUBBLEWRAP: '@bubblewrap/cli@1.27.0'
  KEY_ALIAS: niflaot

jobs:
  new-key:
    if: inputs.mode == 'new-key'
    runs-on: ubuntu-latest
    steps:
      - name: Make the upload key
        env:
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [ -z "$PASS" ] || [ ${#PASS} -lt 8 ]; then
            echo "::error::Set the secret ANDROID_KEYSTORE_PASSWORD first (at least 8 characters)."; exit 1
          fi
          if [ "$HAVE" = "true" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is already set — the app has a key. A new one would not be accepted by Play for the same app."; exit 1
          fi
          mkdir key
          # PKCS12: one password for the store and the key
          keytool -genkeypair -v -storetype PKCS12 -keystore key/niflaot-upload.keystore -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Niflaot, O=MyChitas, C=AT"
          base64 -w0 key/niflaot-upload.keystore > key/niflaot-upload.keystore.base64.txt
          SHA=$(keytool -list -v -keystore key/niflaot-upload.keystore -alias "$KEY_ALIAS" -storepass "$PASS" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          {
            echo "## Upload key is ready"
            echo
            echo "SHA-256 of the upload key: \`$SHA\`"
            echo
            echo "1. Download the artifact **upload-key**, keep \`niflaot-upload.keystore\` and the password in a safe place."
            echo "2. Put the text of \`niflaot-upload.keystore.base64.txt\` into the secret **ANDROID_KEYSTORE_BASE64**."
            echo "3. Delete the artifact (Actions → this run → Artifacts)."
            echo "4. Run this workflow again with mode = build."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upload-key
          path: key/
          retention-days: 1

  build:
    if: inputs.mode == 'build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17' # Bubblewrap accepts only JDK 17
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check the inputs and the secrets
        env:
          CODE: ${{ inputs.version_code }}
          NAME: ${{ inputs.version_name }}
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [[ "$CODE" =~ ^[1-9][0-9]{0,8}$ ]] || { echo "::error::version_code must be a whole number ≥ 1"; exit 1; }
          [[ "$NAME" =~ ^[0-9A-Za-z.\ -]{1,40}$ ]] || { echo "::error::version_name: digits, letters, dots"; exit 1; }
          if [ -z "$KEY" ] || [ -z "$PASS" ]; then
            echo "::error::No upload key: set ANDROID_KEYSTORE_PASSWORD and run this workflow with mode = new-key first."; exit 1
          fi

      - name: Bubblewrap, Android SDK build-tools and the Bubblewrap config
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/bw" "$BUBBLEWRAP" >/dev/null
          echo "BW=$RUNNER_TEMP/bw/node_modules/.bin/bubblewrap" >> "$GITHUB_ENV"
          # the runner has the Android SDK at $ANDROID_HOME; Bubblewrap needs its own build-tools version
          BT=$(node -p "require('$RUNNER_TEMP/bw/node_modules/@bubblewrap/core/dist/lib/androidSdk/AndroidSdkTools.js').BUILD_TOOLS_VERSION")
          echo "build-tools $BT"
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "build-tools;$BT" >/dev/null
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json

      - name: Generate the Android project
        env:
          CODE: ${{ inputs.version_code }}
          NAME: ${{ inputs.version_name }}
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir twa
          jq --argjson code "$CODE" --arg name "$NAME" \
            '.appVersionCode = $code | .appVersionName = $name | .appVersion = $name' android/twa-manifest.json > twa/twa-manifest.json
          echo "$KEY" | base64 -d > twa/niflaot-upload.keystore
          cd twa
          "$BW" update --skipVersionUpgrade

      - name: Build and sign
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd twa
          "$BW" build
          test -s app-release-bundle.aab
          test -s app-release-signed.apk

      - name: assetlinks.json and the summary
        env:
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CODE: ${{ inputs.version_code }}
          NAME: ${{ inputs.version_name }}
          PLAY_SHA256: ${{ vars.ANDROID_PLAY_SHA256 }}
        run: |
          mkdir out
          cp twa/app-release-bundle.aab "out/niflaot-$NAME-$CODE.aab"
          cp twa/app-release-signed.apk "out/niflaot-$NAME-$CODE.apk"
          PKG=$(jq -r .packageId android/twa-manifest.json)
          UP=$(keytool -list -v -keystore twa/niflaot-upload.keystore -alias "$KEY_ALIAS" -storepass "$PASS" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          # the upload key and, if known, the key Google Play signs the app with (Play Console → App integrity)
          jq -n --arg pkg "$PKG" --arg up "$UP" --arg play "$PLAY_SHA256" '[{
            relation: ["delegate_permission/common.handle_all_urls"],
            target: { namespace: "android_app", package_name: $pkg,
                      sha256_cert_fingerprints: ([$up] + ($play | split(",") | map(gsub("^ +| +$"; "")) | map(select(. != "")))) | unique }
          }]' > out/assetlinks.json
          {
            echo "## Niflaot $NAME ($CODE) — $PKG"
            echo
            echo "- \`niflaot-$NAME-$CODE.aab\` — upload to Play Console"
            echo "- \`niflaot-$NAME-$CODE.apk\` — to try on a phone"
            echo "- \`assetlinks.json\` — goes to https://niflaot.app/.well-known/assetlinks.json"
            echo
            echo "Upload key SHA-256: \`$UP\`"
            [ -n "$PLAY_SHA256" ] && echo "Play app signing SHA-256: \`$PLAY_SHA256\`" \
              || echo "Play app signing SHA-256: not set — add it to the variable ANDROID_PLAY_SHA256 (Play Console → App integrity)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: niflaot-android-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: out/
          retention-days: 30
