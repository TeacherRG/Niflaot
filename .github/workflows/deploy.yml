name: Deploy to GitHub Pages (niflaot.mychitas.app)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the whole history: sitemap lastmod and JSON-LD dateModified are the days the pages' sources last changed
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check   # lesson data must be consistent before publishing
      - run: npm run build
        env:
          # URL of the AI assistant worker (assistant/); empty → the assistant is hidden
          VITE_ASSISTANT_URL: ${{ vars.ASSISTANT_URL }}
          # newsletter sign-up form (src/components/Subscribe.tsx), e.g. https://buttondown.com/api/emails/embed-subscribe/<name>;
          # empty → the form is hidden
          VITE_SUBSCRIBE_URL: ${{ vars.SUBSCRIBE_URL }}
          # webmaster tools: the code of the «HTML tag» confirmation (scripts/prerender.ts); empty → no tag
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://niflaot.mychitas.app
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # tell the search engines (Bing, Yandex… — IndexNow) that the pages changed; never fails the deploy
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/indexnow.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
