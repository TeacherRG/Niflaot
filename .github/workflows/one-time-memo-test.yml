name: One-time Memo email test

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type SEND_MEMO_TEST to email the current subscriber
        required: true
        type: string

permissions:
  contents: read

jobs:
  send:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Send the fixed one-time test email
        run: node scripts/send-memo-test.mjs
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          SEND_CONFIRMATION: ${{ inputs.confirm }}
