name = "niflaot-assistant"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://niflaot.mychitas.app"
SITE_URL = "https://niflaot.mychitas.app"
# sender of the login codes; the domain must be verified at Resend (resend.com → Domains)
MAIL_FROM = "Нифлаот <noreply@mychitas.app>"
# questions to the AI assistant a day from everyone together (UTC day); above it the chat says «come back tomorrow».
# Each question is paid (up to 6 model calls) — raise it when the site grows, together with the limit in Billing.
CHAT_DAILY_LIMIT = "1000"
# who may push to this repository may upload the recordings of «Урок дня» (the token of #/admin)
ADMIN_REPO = "TeacherRG/Niflaot"

# Secrets (not stored here): npx wrangler secret put ANTHROPIC_API_KEY, RESEND_API_KEY (login codes by email;
# without it registration is off and the site shows only the guest mode)

# Rate limit for /push and the account's changes: 20 requests per minute from one IP (the worker answers 429 above it).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# Rate limit for /chat: 6 questions per minute from one IP.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 6
  period = 60

# The daily reminder of the site (src/push.ts): subscriptions in a Durable Object with SQLite storage (free plan),
# sending once an hour.
[[durable_objects.bindings]]
name = "PUSH"
class_name = "PushHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PushHub"]

# Accounts of the site (src/accounts.ts): one Durable Object with SQLite storage.
[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Accounts"]

# «Урок дня» (src/audio.ts): the recordings of the passage of the day. R2 must be turned on in the Cloudflare dashboard
# (R2 → Overview; the free tier is 10 GB with no fee for downloads); the deploy workflow creates the bucket.
# If R2 can't be used, the workflow deploys without this block — the site then shows no player.
# --- audio ---
[[r2_buckets]]
binding = "AUDIO"
bucket_name = "niflaot-audio"
# --- /audio ---

[triggers]
crons = ["1 * * * *"]
