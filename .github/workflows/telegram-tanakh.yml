name: Пророки и Писания в Telegram

# Every morning, 04:37 UTC (6:37 in Vienna in summer, 5:37 in winter) — the passage of the day of the three-year cycle.
# Days without a reading (Shabbat, holidays, 9 Av) and Shabbat itself are skipped by the script.
# Setup: the same secret TELEGRAM_BOT_TOKEN and variables TELEGRAM_CHAT_RU / _EN / _DE as «Загадка недели».
on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_RU: ${{ vars.TELEGRAM_CHAT_RU }}
      TELEGRAM_CHAT_EN: ${{ vars.TELEGRAM_CHAT_EN }}
      TELEGRAM_CHAT_DE: ${{ vars.TELEGRAM_CHAT_DE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Post
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' }}
        run: npx tsx scripts/telegram-tanakh.ts
